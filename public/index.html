<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpikeMV Weltrade Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @font-family {
      font-family: 'Faruma';
      src: url('https://cdn.jsdelivr.net/gh/muralm/dhivehi-fonts/Faruma.ttf') format('truetype');
    }
    body, html {
      font-family: 'Faruma', 'MV Boli', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="max-w-3xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div>
        <h1 class="text-3xl font-bold text-amber-400">⚡ SpikeMV Weltrade Analytics</h1>
        <p class="text-slate-400 text-sm mt-1">GainX & PainX Series (M30 Timeframe Analysis)</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center space-x-3 space-x-reverse">
        <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
        <span class="text-emerald-400 text-sm font-semibold" id="connStatus">Socket.io Active</span>
      </div>
    </header>

    <!-- Asset Selector -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3 space-x-reverse">
        <label class="text-amber-400 font-bold text-lg">Weltrade Pair Select ކުރައްވާ:</label>
        <select id="symbolSelect" onchange="switchSymbol(this.value)" class="bg-slate-900 text-slate-100 font-bold px-4 py-2 rounded-xl border border-amber-500/50 outline-none cursor-pointer">
          <optgroup label="📈 GainX Series (Bullish Target)">
            <option value="GAINX400">GainX 400</option>
            <option value="GAINX600">GainX 600</option>
            <option value="GAINX800">GainX 800</option>
            <option value="GAINX999">GainX 999</option>
            <option value="GAINX1200" selected>GainX 1200</option>
          </optgroup>
          <optgroup label="📉 PainX Series (Bearish Target)">
            <option value="PAINX400">PainX 400</option>
            <option value="PAINX600">PainX 600</option>
            <option value="PAINX800">PainX 800</option>
            <option value="PAINX999">PainX 999</option>
            <option value="PAINX1200">PainX 1200</option>
          </optgroup>
        </select>
      </div>
      <div class="text-sm text-slate-400">
        Active Pair: <span id="activePairTag" class="text-emerald-400 font-bold">GAINX1200</span>
      </div>
    </div>

    <!-- Analytics Section (Without Chart) -->
    <div class="space-y-6">
      
      <!-- Dhivehi Suggestion Card -->
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-amber-400 font-bold text-xl">💡 ލައިވް އިރުޝާދު</h3>
          <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-mono font-bold" id="trendBadge">WAITING FOR DATA</span>
        </div>
        <p id="dhivehiText" class="text-slate-200 text-xl leading-relaxed bg-slate-900/60 p-5 rounded-xl border border-slate-700/50">
          މާކެޓް ސިގްނަލަކަށް އިންތިޒާރުކުރެވެނީ...
        </p>
      </div>

      <!-- Metric Details -->
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg space-y-4">
        <div class="flex justify-between items-center pb-3 border-b border-slate-700">
          <span class="text-slate-400 text-lg">Historical Win Rate:</span>
          <span class="text-emerald-400 font-bold text-xl" id="winRateVal">84%</span>
        </div>
        <div class="flex justify-between items-center pb-3 border-b border-slate-700">
          <span class="text-slate-400 text-lg">RSI Indicator:</span>
          <span class="text-slate-200 font-bold text-xl" id="rsiVal">--</span>
        </div>
        <div class="flex justify-between items-center pb-3 border-b border-slate-700">
          <span class="text-slate-400 text-lg">Live Price:</span>
          <span class="text-amber-400 font-bold text-xl" id="priceVal">--</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-400 text-lg">Predictive Score:</span>
          <span class="text-amber-400 font-bold text-xl" id="scoreVal">4.5 / 5.0</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const socket = io();
    let currentSymbol = "GAINX1200";
    let allMarketData = {};

    // Initial state fetch
    fetch('/api/state')
      .then(res => res.json())
      .then(data => {
        allMarketData = data || {};
        updateUI();
      }).catch(err => console.log('State Fetch Error:', err));

    socket.on('market_update', (payload) => {
      if (payload && payload.allPairs) {
        allMarketData = payload.allPairs;
        updateUI();
      }
    });

    function switchSymbol(symbol) {
      currentSymbol = symbol.toUpperCase().trim();
      document.getElementById('activePairTag').innerText = currentSymbol;
      updateUI();
    }

    function updateUI() {
      const matchedKey = Object.keys(allMarketData).find(
        key => key.toUpperCase().includes(currentSymbol) || currentSymbol.includes(key.toUpperCase())
      );

      const data = matchedKey ? allMarketData[matchedKey] : null;

      if (data) {
        document.getElementById('trendBadge').innerText = data.trend || "ACTIVE";
        document.getElementById('dhivehiText').innerText = data.suggestion || "ޑޭޓާ ލިބެމުންދަނީ...";
        document.getElementById('rsiVal').innerText = data.rsi !== undefined ? data.rsi : "--";
        document.getElementById('priceVal').innerText = data.price !== undefined ? data.price : "--";
        document.getElementById('winRateVal').innerText = data.winRate || "84%";
      } else {
        document.getElementById('dhivehiText').innerText = `⚠️ ${currentSymbol} އަށް MT5 EA އަޅާފައިވާނަމަ WebRequest މެދުވެރިކޮށް ޑޭޓާ ލިބޭނެއެވެ.`;
        document.getElementById('trendBadge').innerText = "NO LIVE DATA";
        document.getElementById('rsiVal').innerText = "--";
        document.getElementById('priceVal').innerText = "--";
      }
    }
  </script>
</body>
</html>
