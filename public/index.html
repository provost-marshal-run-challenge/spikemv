<script>
  const socket = io();
  let currentSymbol = "GAINX1200"; // Always store in uppercase
  let allMarketData = {};

  const chart = LightweightCharts.createChart(document.getElementById('chartContainer'), {
    layout: { backgroundColor: '#0f172a', textColor: '#cbd5e1' },
    grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } }
  });
  const candleSeries = chart.addCandlestickSeries({
    upColor: '#22c55e', downColor: '#ef4444',
    borderUpColor: '#22c55e', borderDownColor: '#ef4444'
  });

  socket.on('market_update', (payload) => {
    // Normalize incoming symbol keys to UPPERCASE
    allMarketData = {};
    if (payload.allPairs) {
      Object.keys(payload.allPairs).forEach(key => {
        allMarketData[key.toUpperCase()] = payload.allPairs[key];
      });
    }
    updateUI();
  });

  function switchSymbol(symbol) {
    currentSymbol = symbol.toUpperCase();
    document.getElementById('activePairTag').innerText = symbol;
    document.getElementById('symbolTitle').innerText = `${symbol} (M30)`;
    updateUI();
  }

  function updateUI() {
    // Exact Case Matching
    const targetKey = Object.keys(allMarketData).find(
      k => k.includes(currentSymbol) || currentSymbol.includes(k)
    );
    const data = targetKey ? allMarketData[targetKey] : null;

    if (data) {
      document.getElementById('trendBadge').innerText = data.trend;
      document.getElementById('dhivehiText').innerText = data.suggestion;
      document.getElementById('rsiVal').innerText = data.rsi;
      document.getElementById('priceVal').innerText = data.price;
      document.getElementById('winRateVal').innerText = data.winRate || "84%";
    } else {
      document.getElementById('dhivehiText').innerText = `⚠️ ${currentSymbol} އަށް MT5 EA އަޅާފައިވާނަމަ WebRequest މެދުވެރިކޮށް ޑޭޓާ ލިބޭނެއެވެ.`;
      document.getElementById('trendBadge').innerText = "NO LIVE DATA";
      document.getElementById('rsiVal').innerText = "--";
      document.getElementById('priceVal').innerText = "--";
    }
  }
</script>
